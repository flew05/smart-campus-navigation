# =====================================================
# SonarQube Configuration
# =====================================================

# Project Information
sonar.projectKey=smart-campus-navigation
sonar.projectName=Smart Campus Navigation System
sonar.projectVersion=1.0.0

# Source Code Directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# Source Encoding
sonar.sourceEncoding=UTF-8

# Java Version
sonar.java.source=11
sonar.java.target=11
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Coverage Report Paths
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Exclusions
sonar.exclusions=**/target/**,**/test/**,**/*.xml,**/*.json,**/*.yml,**/*.yaml,**/*.properties

# Test Exclusions
sonar.test.exclusions=**/test/**,**/*Test.java,**/*Tests.java

# Code Coverage Exclusions
sonar.coverage.exclusions=**/config/**,**/dto/**,**/entity/**,**/Application.java

# Analysis Parameters
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Language
sonar.language=java

# Additional Settings
sonar.dynamicAnalysis=reuseReports
sonar.java.coveragePlugin=jacoco

