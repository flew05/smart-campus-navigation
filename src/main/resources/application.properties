# =====================================================
# Server Configuration
# =====================================================
server.port=8888
server.servlet.context-path=/
server.compression.enabled=true

# =====================================================
# Application Configuration
# =====================================================
spring.application.name=smart-campus-navigation

# =====================================================
# Actuator Configuration (Health Checks)
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
management.metrics.export.prometheus.enabled=true

# =====================================================
# Database Configuration (H2)
# =====================================================
spring.datasource.url=jdbc:h2:mem:smartcampus
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# Logging Configuration
# =====================================================
logging.level.root=INFO
logging.level.com.smartcampus=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# Log file configuration
logging.file.name=logs/smart-campus-navigation.log
logging.file.max-size=10MB
logging.file.max-history=30

# Log patterns
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =====================================================
# Application Info (for Actuator)
# =====================================================
info.app.name=Smart Campus Navigation System
info.app.description=Smart Campus Navigation System for University
info.app.version=@project.version@
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@

# =====================================================
# Custom Application Properties
# =====================================================
app.campus.name=University Campus
app.campus.default-language=en
app.navigation.max-distance=5000
app.navigation.default-speed=1.4

